<h1>Camera connection test</h1>
<p>Try Camera first, then Both. Allow the site and browser prompts. After success or failure, download the report below.</p>
<button data-kind="video">Camera</button>
<button data-kind="both">Both</button>
<button data-kind="audio">Microphone</button>
<button id="stop">Stop</button>
<button id="permissions">Permissions</button>
<p id="status" role="status">Ready</p>
<video autoplay muted playsinline style="width:280px;height:180px"></video>
<script>
if (window !== window.top) {
  const log = window.mediaDiagnosticLog;
  const status = document.querySelector('#status');
  const buttons = [...document.querySelectorAll('[data-kind]')];
  let stream;
  document.querySelector('#stop').onclick = () => {
    stream?.getTracks().forEach((track) => track.stop());
    log('app-stop'); status.textContent = 'Stopped';
  };
  document.querySelector('#permissions').onclick = () => window.showPeripheralPermissions();
  for (const button of buttons) button.onclick = async () => {
    stream?.getTracks().forEach((track) => track.stop());
    const kind = button.dataset.kind;
    buttons.forEach((item) => { item.disabled = true; });
    status.textContent = 'Requesting access…';
    log('app-request', { kind });
    const watchdog = setTimeout(() => {
      status.textContent = 'Still waiting after 45 seconds. Download the report, then reload before another test.';
      log('app-still-pending', { kind });
    }, 45000);
    try {
      // No AudioContext resume gate: isolate getUserMedia and its bridge.
      stream = await navigator.mediaDevices.getUserMedia({ audio: kind !== 'video', video: kind !== 'audio' });
      log('app-resolved', { kind, tracks: stream.getTracks().map((track) => ({ kind: track.kind, muted: track.muted, readyState: track.readyState })) });
      document.querySelector('video').srcObject = stream;
      status.textContent = 'Connected. Stop before the next test.';
      for (const track of stream.getTracks()) track.addEventListener('ended', () => log('app-track-ended', { kind: track.kind }));
    } catch (error) {
      status.textContent = `${error.name}: ${error.message}`;
      log('app-rejected', { kind, name: error.name });
    } finally { clearTimeout(watchdog); buttons.forEach((item) => { item.disabled = false; }); }
  };
}
</script>
