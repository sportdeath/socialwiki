<template id="history-template">
    <two-pane-layout left-title="History" right-title="Preview">
        <template #left-pane>
            <div class="history-pane-content">
                <section v-if="discoveryError" class="protection-panel" role="alert">
                    <h3>Could not check site data</h3>
                    <p>{{ discoveryError.message }}. Retrying…</p>
                </section>
                <section
                    v-else-if="isProtected === undefined"
                    class="protection-panel"
                >
                    <h3>Loading...</h3>
                </section>
                <section class="protection-panel" v-else>
                    <h3>
                        {{
                            isProtected ? "Protected Site" : "Unprotected Site"
                        }}
                    </h3>

                    <template v-if="isProtected">
                        <protection-notice
                            :active-protection="activeProtection"
                            :is-protection-by-session-actor="
                                isProtectionBySessionActor
                            "
                            :active-protection-trust-source="
                                activeProtectionTrustSource
                            "
                        ></protection-notice>
                        <p>
                            Only changes made or endorsed by your
                            <a :href="trustedEditorsRoute">trusted editors</a>
                            will be shown to you in the
                            <a :href="viewAddress">View</a> tab.
                        </p>
                    </template>
                    <p v-else>
                        This site has <strong>not</strong> been marked as
                        protected by you or an
                        <a :href="trustedEditorsRoute">editor you trust</a>.
                        Anyone's changes to this site will be visible to you.
                    </p>

                    <p v-if="$graffitiSession.value">
                        <button
                            type="button"
                            :disabled="
                                hasPendingMutation || isProtected === undefined
                            "
                            :class="{ warning: isProtected }"
                            @click="
                                handleUpdateSiteProtection(
                                    $graffitiSession.value,
                                )
                            "
                        >
                            {{ protectionActionLabel }}
                        </button>
                    </p>
                    <p v-else>
                        <button @click="$graffiti.login()">
                            Log in to manage protection
                        </button>
                    </p>

                    <details
                        class="protection-history"
                        v-if="protectionHistory && protectionHistory.length"
                    >
                        <summary>Protection history</summary>
                        <ol class="protection-history-list">
                            <li
                                v-for="annotation in protectionHistory"
                                :key="annotation.url"
                            >
                                <p>
                                    {{
                                        annotation.value.action === "Protect site"
                                            ? "Protected"
                                            : "Protection removed"
                                    }}
                                    by
                                    <strong>
                                        <graffiti-actor-to-handle
                                            :actor="annotation.actor"
                                        ></graffiti-actor-to-handle>
                                    </strong>
                                    <span
                                        v-if="
                                            isActorInDefaultTrustedList(
                                                annotation.actor,
                                            )
                                        "
                                        class="history-default-indicator"
                                    >
                                        (Default trusted editor)
                                    </span>
                                </p>
                                <time
                                    :datetime="
                                        timestamp(
                                            annotation.value.time,
                                            true,
                                        )
                                    "
                                >
                                    {{ timestamp(annotation.value.time) }}
                                </time>
                                <p
                                    v-if="
                                        $graffitiSession.value?.actor ===
                                        annotation.actor
                                    "
                                >
                                    <button
                                        type="button"
                                        class="warning"
                                        :disabled="hasPendingMutation"
                                        @click="
                                            undoProtectionHistory(
                                                annotation,
                                                $graffitiSession.value,
                                            )
                                        "
                                    >
                                        {{
                                            isUndoingProtection(annotation)
                                                ? "Undoing..."
                                                : "Undo"
                                        }}
                                    </button>
                                </p>
                            </li>
                        </ol>
                    </details>
                </section>

                <ol class="history-list">
                    <li
                        v-for="(version, index) in siteVersions"
                        :key="version.url"
                    >
                        <article
                            :id="version.url"
                            :class="{
                                selected: isSelected(version),
                                untrusted:
                                    isVersionUntrusted(version) &&
                                    !isSelected(version),
                            }"
                        >
                            <header>
                                <h3>
                                    <a
                                        class="version-select"
                                        :href="versionRoute(version)"
                                        :aria-current="
                                            isSelected(version)
                                                ? 'true'
                                                : undefined
                                        "
                                    >
                                        {{
                                            formatSummary(version.value.changes)
                                        }}
                                    </a>
                                </h3>
                            </header>

                            <div class="history-meta">
                                <p class="history-actor-row">
                                    <strong class="history-actor">
                                        <graffiti-actor-to-handle
                                            :actor="version.actor"
                                        ></graffiti-actor-to-handle>
                                    </strong>
                                    <span
                                        v-if="
                                            isVersionUntrusted(version) &&
                                            !isSelected(version)
                                        "
                                        class="history-untrusted-indicator"
                                    >
                                        (Untrusted editor)
                                    </span>
                                    <span
                                        class="history-trust-inline"
                                        v-if="isSelected(version)"
                                    >
                                        <template
                                            v-if="
                                                $graffitiSession.value
                                                    ?.actor === version.actor
                                            "
                                        >
                                            <span>(You.)</span>
                                        </template>
                                        <template
                                            v-else-if="
                                                getActorTrustStatus(
                                                    version.actor,
                                                ) === 'trusted'
                                            "
                                        >
                                            <span>
                                                ({{
                                                    isActorInDefaultTrustedList(
                                                        version.actor,
                                                    )
                                                        ? "Default trusted editor."
                                                        : "Trusted editor."
                                                }}
                                            </span>
                                            <button
                                                class="secondary"
                                                type="button"
                                                v-if="
                                                    $graffitiSession.value &&
                                                    !isUpdatingTrust(
                                                        version.actor,
                                                    )
                                                "
                                                @click.stop.prevent="
                                                    toggleActorTrust(
                                                        version.actor,
                                                        $graffitiSession.value,
                                                    )
                                                "
                                            >
                                                Untrust?
                                            </button>
                                            <button
                                                class="secondary"
                                                disabled
                                                type="button"
                                                v-else-if="
                                                    isUpdatingTrust(
                                                        version.actor,
                                                    )
                                                "
                                            >
                                                Updating...
                                            </button>
                                            <span>)</span>
                                        </template>
                                        <template
                                            v-else-if="
                                                getActorTrustStatus(
                                                    version.actor,
                                                ) === 'untrusted'
                                            "
                                        >
                                            <span>(Untrusted editor.</span>
                                            <button
                                                type="button"
                                                v-if="
                                                    $graffitiSession.value &&
                                                    !isUpdatingTrust(
                                                        version.actor,
                                                    )
                                                "
                                                @click.stop.prevent="
                                                    toggleActorTrust(
                                                        version.actor,
                                                        $graffitiSession.value,
                                                    )
                                                "
                                            >
                                                Trust?
                                            </button>
                                            <button
                                                class="secondary"
                                                disabled
                                                type="button"
                                                v-else-if="
                                                    isUpdatingTrust(
                                                        version.actor,
                                                    )
                                                "
                                            >
                                                Updating...
                                            </button>
                                            <span>)</span>
                                        </template>
                                        <span v-else>(Loading...)</span>
                                    </span>
                                </p>
                                <time
                                    :datetime="
                                        timestamp(version.value.time, true)
                                    "
                                >
                                    {{ timestamp(version.value.time) }}
                                </time>
                            </div>

                            <footer v-if="isSelected(version)">
                                <ul>
                                    <li
                                        v-if="
                                            $graffitiSession.value &&
                                            index !== 0
                                        "
                                    >
                                        <button
                                            :disabled="hasPendingMutation"
                                            @click.stop="
                                                republishSiteVersion(
                                                    'Restore',
                                                    version,
                                                    $graffitiSession.value,
                                                )
                                            "
                                        >
                                            {{
                                                isRestoringVersion(version)
                                                    ? "Restoring..."
                                                    : "Restore"
                                            }}
                                        </button>
                                    </li>
                                    <li
                                        v-if="
                                            $graffitiSession.value &&
                                            index === 0 &&
                                            $graffitiSession.value.actor !==
                                                version.actor
                                        "
                                    >
                                        <button
                                            :disabled="hasPendingMutation"
                                            @click.stop="
                                                republishSiteVersion(
                                                    'Endorse',
                                                    version,
                                                    $graffitiSession.value,
                                                )
                                            "
                                        >
                                            {{
                                                isEndorsingVersion(version)
                                                    ? "Endorsing..."
                                                    : "Endorse"
                                            }}
                                        </button>
                                    </li>
                                    <li>
                                        <a :href="editAddress"> Edit </a>
                                    </li>
                                    <li>
                                        <a :href="previewHref"> Link </a>
                                    </li>
                                    <li
                                        v-if="
                                            $graffitiSession.value?.actor ===
                                            version.actor
                                        "
                                    >
                                        <button
                                            class="warning"
                                            :disabled="hasPendingMutation"
                                            @click.stop="
                                                deleteSelectedSiteVersion(
                                                    version,
                                                    $graffitiSession.value,
                                                )
                                            "
                                        >
                                            {{
                                                isDeletingVersion(version)
                                                    ? "Deleting..."
                                                    : "Delete"
                                            }}
                                        </button>
                                    </li>
                                </ul>
                            </footer>
                        </article>
                    </li>
                </ol>
            </div>
        </template>
        <template #right-pane>
            <sw-transclude
                v-if="previewAddress"
                key="preview"
                id="preview"
                name="Preview"
                :src="previewAddress"
                :route="previewRoute"
                @sw-lens-output="onPreviewOutput"
            ></sw-transclude>
            <sw-transclude
                v-else
                key="loading"
                id="preview"
                name="Preview"
                :srcdoc="previewStatusPage"
            ></sw-transclude>
        </template>
    </two-pane-layout>
</template>
