<!doctype html>
<!-- This loader selects the signed-in user's Social.Wiki browser. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Social.Wiki</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="data:," />
        <script>
            // Keep this browser's own address when the kernel wraps it.
            // Descendants inherit this base for links, including new-tab clicks.
            if (window.top === window) {
                const base = document.createElement("base");
                base.href = window.location.href;
                document.head.prepend(base);
            }
        </script>
        <style>
            html,
            body,
            #browser {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
        </style>
        <script vite-ignore src="./locator.js"></script>
        <script vite-ignore src="./init.js"></script>
        <script type="module">
            import { startBrowserLoader } from "./bootstrap.ts";

            // The kernel will wrap this document in an outer layer, so to
            // avoid running the code twice, don't bother executing until
            // the wrapper is set up
            if (window.top !== window) startBrowserLoader();
        </script>
    </head>
    <body>
        <sw-transclude id="browser" name="Browser"></sw-transclude>
    </body>
</html>
