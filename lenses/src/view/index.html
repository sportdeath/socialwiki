<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social.Wiki View Lens</title>
    <link rel="icon" type="image/svg+xml" href="../icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./style.css" />
    <script vite-ignore src="../init.js"></script>
    <script vite-ignore src="../locator.js"></script>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app">Loading...</div>
    <template id="app-template">
      <!--
      We set 'route=""' because View does not consume any of its
      supplied route. The route it receives is passed directly to
      its child document.
      -->
      <sw-transclude
        ref="transclude"
        autosize="inherit"
        :id="displayed.id"
        :name="displayedSiteName"
        route=""
        :query="siteQuery"
        :srcdoc="displayed.html"
        @sw-document-metadata="onChildMetadata"
      ></sw-transclude>
    </template>
  </body>
</html>
